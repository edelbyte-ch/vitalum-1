name: Dependabot auto-merge
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Auf den PR-Autor pruefen, nicht auf github.actor: sobald dieser Workflow
    # selbst einen Commit auf den PR schiebt, waere der Actor github-actions[bot]
    # und die Bedingung liefe ins Leere.
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2

      # Den PR-Branch selbst auschecken, nicht den Merge-Ref - sonst laesst
      # sich nichts auf den PR zurueckschieben.
      - name: Checkout (PR-Branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      # Dependabot aendert nur package.json. bun.lock kann es nicht regenerieren
      # (es behandelt bun als npm-Oekosystem) - `bun install --frozen-lockfile`
      # im Dockerfile lehnt deshalb JEDEN seiner PRs ab. Hier wird das Lockfile
      # im selben Abbild nachgezogen, das auch Dokploy baut, und auf den PR
      # zurueckgeschoben.
      #
      # Gefahrlos nur, solange keine Abhaengigkeit auf "latest" steht - eine
      # Regeneration zoege sonst ungefragt fremde Upgrades mit.
      #
      # Ein Push mit GITHUB_TOKEN loest keinen neuen Workflow-Lauf aus, darum
      # geht es in DIESEM Lauf mit dem Build-Gate weiter - keine Rekursion.
      - name: bun.lock nachziehen
        run: |
          set -e
          docker run --rm -v "$PWD":/app -w /app -e HOME=/tmp oven/bun:1-alpine bun install
          sudo chown -R "$(id -u):$(id -g)" .
          if git diff --quiet -- bun.lock; then
            echo "bun.lock war bereits aktuell."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "bun.lock zum Dependabot-Bump nachziehen"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
            echo "bun.lock nachgezogen und auf den PR geschoben."
          fi

      # Baut JEDES Dockerfile im Repo. Die fruehere Pruefung `if [ -f Dockerfile ]`
      # uebersprang sich in Monorepos selbst und liess den Merge ungeprueft durch.
      # Deshalb: kein Dockerfile = Fehler, nicht "uebersprungen". Ein Gate, das
      # sich selbst ueberspringt, ist schlimmer als keines.
      #
      # Die Secrets sind reine Attrappen: syntaktisch gueltig, damit Dockerfiles
      # mit `--mount=type=secret` (prisma.config.ts, SMTP-Prerender) ueberhaupt
      # laden, aber kein echter Zugang. Ohne sie war das Gate in jedem Repo mit
      # Secret-Mounts bei JEDEM Lauf rot und hat nie etwas validiert. Nicht
      # gemountete Secrets ignoriert BuildKit - die Liste darf ein Superset sein.
      # DATABASE_URL zusaetzlich als --build-arg: manche Dockerfiles (grabebox,
      # edelchat) nehmen es per ARG statt per Secret; ein ungenutztes Build-Arg
      # ist fuer BuildKit nur eine Warnung.
      - name: Docker build gate
        id: build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          GMAIL_USER: ci@localhost
          GMAIL_APP_PASSWORD: ci
          SMTP_HOST: localhost
          SMTP_PORT: "25"
          SMTP_SECURE: "false"
          SMTP_USER: ci
          SMTP_PASS: ci
          SMTP_FROM: ci@localhost
        run: |
          set -e
          secrets=()
          for s in DATABASE_URL GMAIL_USER GMAIL_APP_PASSWORD SMTP_HOST SMTP_PORT SMTP_SECURE SMTP_USER SMTP_PASS SMTP_FROM; do
            secrets+=(--secret "id=$s,env=$s")
          done
          found=0
          while IFS= read -r df; do
            found=1
            tag="ci-validate:$(echo "${df#./}" | tr '/' '-')"
            echo "::group::docker build -f $df ."
            docker build -f "$df" -t "$tag" "${secrets[@]}" --build-arg "DATABASE_URL=$DATABASE_URL" .
            echo "::endgroup::"
          done < <(find . -name Dockerfile -not -path '*/node_modules/*' -not -path './.git/*' | sort)
          if [ "$found" = 0 ]; then
            echo "::error::Kein Dockerfile im Repo gefunden - das Gate kann nichts validieren. Merge verweigert."
            exit 1
          fi

      - name: Auto-merge (Security patch & minor, Build bestanden)
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
